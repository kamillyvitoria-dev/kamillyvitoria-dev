name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238A2BE2&color_dots=%23D8B4FE,%23C084FC,%23A855F7,%238A2BE2,%236D28D9
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C084FC&color_dots=%236D28D9,%238A2BE2,%23A855F7,%23C084FC,%23D8B4FE

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
